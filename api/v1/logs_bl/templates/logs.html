<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogArbor – Logs</title>

    <link rel="stylesheet" href="{{ url_for('auth_bl.static', filename='register.css') }}">
    <link rel="stylesheet" href="{{ url_for('home_blp.static', filename='dashboard.css') }}">
    <link rel="icon" type="image/jpeg" href="https://i.imgur.com/Gu7EcLR.jpeg">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">
            <img class="img-logo-dashboard" src="https://i.imgur.com/Gu7EcLR.jpeg" alt="Logo"
                referrerpolicy="no-referrer">

            <nav class="sidebar-nav">
                <a href="/home/dashboard">Dashboard</a>
                <a href="/services">Services</a>
                <a class="active">Logs</a>
                <a href="/alerts">Alerts</a>
                <a href="/settings">Settings</a>
            </nav>
        </aside>

        <!-- Main -->
        <main class="main">

            <!-- Topbar -->
            <header class="topbar">
                <h1>Logs</h1>
                <span class="env">All Services</span>
            </header>

            <!-- Logs Terminal -->
            <div id="terminalServicesWrapper">
                <p>Loading your logs...</p>
                <p>A fun fact about LogArbor here</p>
            </div>

        </main>

        <footer class="app-footer">
            <div class="footer-left">
                <a href="/support">Need Help</a>
                <a href="/docs">Documentation</a>
                <a href="/support/feedback">Seeing something unexpected?</a>
            </div>

            <div class="footer-right">
                <span class="status-dot online"></span>
                <span class="status-text">System Status: All good</span>
            </div>
        </footer>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="{{ url_for('logs_bl.static', filename='logs.js') }}"></script>

</body>

</html>
